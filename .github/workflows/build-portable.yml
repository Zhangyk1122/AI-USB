name: build-portable

# 打一个 v* 标签，或手动触发，就会在 Windows runner 上构建完整便携包。
# 标签运行会发布 Release；手动运行只上传 Actions 产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read pinned versions from BUILD-INFO.json
        id: pins
        shell: pwsh
        run: |
          $info = Get-Content BUILD-INFO.json -Raw | ConvertFrom-Json
          "node_version=$($info.versions.node)" >> $env:GITHUB_OUTPUT
          "dsh_version=$($info.versions.'deepseek-harness')" >> $env:GITHUB_OUTPUT
          "pnpm_version=$($info.versions.pnpm)" >> $env:GITHUB_OUTPUT

      - name: Install the only Agent (dsh)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path platforms\win32-x64 | Out-Null
          npm install --prefix platforms/win32-x64 "@deepseek-ai/dsh@${{ steps.pins.outputs.dsh_version }}" --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }

      - name: Download Node for Windows
        shell: pwsh
        run: |
          $v = "${{ steps.pins.outputs.node_version }}"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extract -Force
          Copy-Item "node-extract/node-v$v-win-x64/node.exe" platforms/win32-x64/node.exe -Force

      - name: Download pnpm for Windows
        shell: pwsh
        run: |
          $v = "${{ steps.pins.outputs.pnpm_version }}"
          Invoke-WebRequest -Uri "https://github.com/pnpm/pnpm/releases/download/v$v/pnpm-win32-x64.zip" -OutFile pnpm.zip
          Expand-Archive pnpm.zip -DestinationPath platforms/win32-x64/pnpm -Force

      - name: Seal integrity manifest and versions
        run: node lib/seal.mjs

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Smoke test (hash check + real dsh --version)
        run: node lib/doctor.mjs --verify-hashes

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path workspace | Out-Null
          if (-not (Test-Path workspace/README.md)) {
            Set-Content -Path workspace/README.md -Value "# Demo 工作目录`n`n默认只在这个目录里操作。可用 AI_USB_WORKSPACE 环境变量指定其他代码目录。"
          }
          $name = "AI-USB-Demo-win32-x64.zip"
          if (Test-Path $name) { Remove-Item $name -Force }
          $items = @('dsh.bat','dsh.ps1','Windows-Start.bat','Windows-Maintain.bat','Windows-Maintain.ps1',
                     '使用说明.txt','plugins.example.txt','README.md','MAINTENANCE.md','VALIDATION.md',
                     'BUILD-INFO.json','RUNTIME-SHA256.json','lib','tests','platforms','workspace')
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip a -tzip -mx=5 $name @items | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          } else {
            Compress-Archive -Path $items -DestinationPath $name -CompressionLevel Optimal
          }
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path SHA256SUMS.txt -Value "$hash  $name"
          Get-Item $name | Select-Object Name, Length

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AI-USB-Demo-win32-x64
          path: |
            AI-USB-Demo-win32-x64.zip
            SHA256SUMS.txt
          retention-days: 7

      - name: Publish release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            AI-USB-Demo-win32-x64.zip
            SHA256SUMS.txt
